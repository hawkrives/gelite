[package]
name = "conn_pool"
version = "0.1.0"
license = "MIT/Apache-2.0"
authors = ["MagicStack Inc. <hello@magic.io>"]
edition = "2021"

[lints]
workspace = true

[features]
python_extension = ["pyo3"]
optimizer = ["genetic_algorithm", "lru", "rand", "rand_08", "statrs", "anyhow", "tokio/test-util"]

[dependencies]
pyo3 = { workspace = true, optional = true }
tokio.workspace = true
pyo3_util.workspace = true
tracing.workspace = true

futures = "0"
scopeguard = "1"
itertools = "0"
thiserror = "2"
strum = { version = "0.26", features = ["derive"] }
consume_on_drop = "0"
smart-default = "0"
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"

# For the optimizer
genetic_algorithm = { version = "0.9.0", optional = true }
lru = { version = "0.12.4", optional = true }
rand = { version = "0.9.0", optional = true }
# genetic_algorithm 0.9 takes an `impl rand 0.8 Rng`, so the optimizer needs a
# 0.8 generator alongside the 0.9 one used elsewhere. rand 0.8 is already in the
# tree via genetic_algorithm, so this pulls in no new crates.
rand_08 = { package = "rand", version = "0.8.6", optional = true }
statrs = { version = "0.17.1", optional = true }
anyhow = { version = "1", optional = true }

derive_more = { version = "2", features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

pretty_assertions = "=1.4.1"
test-log = { version = "=0.2.17", features = ["trace"] }
anyhow = "=1.0.97"
rstest = "=0.26.1"

statrs = "=0.17.1"
rand = "=0.9.3"

[lib]

[[bin]]
name = "optimizer"
required-features = ["optimizer"]
