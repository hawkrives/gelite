name: Update Test Timings

# The shard balancer packs tests by estimated duration, and its estimates
# come from .github/time_stats.csv. Stale estimates silently degrade into
# packing by test count: before this file was committed, one shard ran 973
# tests in 49 minutes while another ran 955 in 9.
#
# Rather than measuring on a schedule - which would mean running the whole
# suite just to time it - this harvests the timings that pushes to master
# already produce, and proposes them as a pull request.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          A successful Tests run on master to harvest. Required for a manual
          run; the automatic trigger uses the run that just finished.
        required: true

# Two runs force-pushing the same branch would race. This serialises them
# without cancelling: a queued run still has useful timings to merge, and
# the freshness check below is what decides whether they are current.
concurrency:
  group: update-test-timings
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Timings from a failed run are incomplete: shards that died early
    # never wrote their counts, and the merge below would then treat their
    # tests as unmeasured.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: false

    # A Tests run on an older commit can finish after one on a newer commit,
    # and this workflow would then force-push the older timings over the
    # newer. A concurrency group cannot fix that: it resolves in favour of
    # whichever event arrives last, which is the stale one. Ordering has to
    # be checked directly. Skipping is safe - the newer commit's own run
    # updates the file instead.
    - name: Skip if the harvested run is not master's tip
      if: github.event_name != 'workflow_dispatch'
      run: |
        set -euo pipefail
        harvested='${{ github.event.workflow_run.head_sha }}'
        tip=$(git rev-parse HEAD)
        if [ "$harvested" != "$tip" ]; then
          echo "::notice::harvested run is $harvested but master is now" \
               "$tip; a newer run will supply fresher timings"
          echo "SKIP=1" >> "$GITHUB_ENV"
        fi

    - name: Set up uv and Python
      if: env.SKIP != '1'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        python-version: '3.12.2'
        activate-environment: true
        # Only needed for the interpreter: the merge below is stdlib csv, so
        # nothing is ever installed and UV_CACHE_DIR is never created. Left
        # on, the post-run save fails with "Cache path ... does not exist".
        enable-cache: false

    - name: Download the run's shard results
      if: env.SKIP != '1'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: python-test-results-*
        merge-multiple: true
        path: results
        run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Merge the timings
      if: env.SKIP != '1'
      shell: python
      run: |
        import csv
        import decimal
        import glob
        import io

        # Same merge test-conclusion performs: a row wins when its run
        # count has increased, meaning this run measured it.
        orig = {}
        with open(".github/time_stats.csv") as f:
            for name, t, c in csv.reader(f):
                assert name not in orig, "duplicate test name in stats!"
                orig[name] = (t, int(c))
        committed = dict(orig)

        new = {}
        for path in glob.glob("results/running_times_*.csv"):
            with open(path) as f:
                for name, t, c in csv.reader(f):
                    if int(c) > orig.get(name, (0, 0))[1]:
                        if not name.startswith("setup::"):
                            assert name not in new, f"duplicate test! {name}"
                        new[name] = (t, c)

        assert new, "no shard reported newer timings; nothing to update"

        orig.update(new)

        # Round to two significant figures. At full float precision every
        # one of the ~13,900 rows changes on every run - the last refresh
        # was "13870 insertions(+), 13870 deletions(-)" - which made the
        # `git diff --quiet` guard below unreachable and every diff
        # unreviewable. Two sig figs costs 0.04% of the total estimate,
        # measured across the whole file, and the balancer is packing bins
        # by estimate: it does not need the third digit.
        def sig2(value):
            d = decimal.Decimal(value)
            if d == 0:
                return "0"
            return format(round(d, -(d.adjusted() - 1)).normalize(), "f")

        # Rounding alone does not settle the file: runner.py keeps a running
        # average as (mean, observation count) and bumps the count on every
        # measurement, so all ~13,900 rows would still churn on the third
        # column. The count is only there to weight the next measurement, so
        # when the rounded estimate has not moved, keep the count as well and
        # the row is byte-identical. Rows whose estimate did move carry their
        # new count, which is what makes the next average weight it correctly.
        buf = io.StringIO()
        writer = csv.writer(buf)
        unchanged = 0
        for k, (t, c) in sorted(orig.items()):
            rounded = sig2(t)
            was = committed.get(k)
            if was is not None and sig2(was[0]) == rounded:
                c = was[1]
                unchanged += 1
            writer.writerow((k, rounded, c))
        with open(".github/time_stats.csv", "w") as f:
            f.write(buf.getvalue())

        print(f"{len(new)} rows measured, {len(orig)} total, "
              f"{unchanged} estimates unchanged")

    - name: Open or update the pull request
      if: env.SKIP != '1'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if git diff --quiet -- .github/time_stats.csv; then
          echo "timings unchanged; nothing to propose"
          exit 0
        fi

        branch=chore/update-test-timings
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$branch"
        git add .github/time_stats.csv
        git commit -m "Update test timings from ${{ github.sha }}"
        git push -f origin "$branch"

        # A pull request opened with GITHUB_TOKEN does not trigger
        # workflows, so this proposes the data without spending a matrix
        # run on it.
        if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
          gh pr create --head "$branch" --base master \
            --title "Update test timings" \
            --body "Shard timings harvested from the last successful \`Tests\` run on \`master\`.

        These drive \`get_cases_by_shard\`, which packs tests by estimated duration. When they go stale the balancer degrades into packing by test count.

        Generated by \`.github/workflows/update-test-timings.yml\`."
        else
          echo "pull request already open; branch updated"
        fi
